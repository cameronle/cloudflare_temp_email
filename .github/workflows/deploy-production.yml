name: Deploy Production

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-mail-production
  cancel-in-progress: true

jobs:
  deploy-backend:
    name: Deploy Worker backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: Install backend dependencies
        working-directory: worker
        run: pnpm install --no-frozen-lockfile

      - name: Deploy Worker
        working-directory: worker
        run: pnpm exec wrangler deploy --minify
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-frontend:
    name: Deploy Pages frontend
    needs: deploy-backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: Configure frontend API endpoint
        run: |
          printf '%s\n' \
            'VITE_API_BASE=https://temp-api.865455.xyz' \
            'VITE_DEFAULT_LANG=zh' > frontend/.env.prod

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --no-frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: pnpm run build:pages

      - name: Deploy Pages
        working-directory: frontend
        run: pnpm exec wrangler pages deploy ./dist --project-name temp-mail-865455 --branch production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
