name = "temp-mail-api-865455"
main = "src/worker.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

routes = [
  { pattern = "temp-api.865455.xyz", custom_domain = true }
]

[triggers]
crons = ["0 */6 * * *"]

[vars]
DEFAULT_LANG = "zh"
PREFIX = "tmp"
DEFAULT_DOMAINS = ["lxw.us.kg", "865455.xyz", "lqq.us.kg"]
DOMAINS = ["lxw.us.kg", "865455.xyz", "lqq.us.kg"]
ENABLE_USER_CREATE_EMAIL = true
ENABLE_USER_DELETE_EMAIL = true
ENABLE_AUTO_REPLY = false
ADMIN_USER_ROLE = "admin"
FRONTEND_URL = "https://mail.865455.xyz"
BACKEND_URL = "https://temp-api.865455.xyz"
DISABLE_SHOW_GITHUB = true
TG_MAX_ADDRESS = 5
TG_ALLOW_USER_LANG = true

[[d1_databases]]
binding = "DB"
database_name = "temp-mail-db-865455"
database_id = "1c8802be-91b5-435b-9b27-89150ab32e69"

[[kv_namespaces]]
binding = "KV"
id = "31ebb1a4a08c411daa7e5c07711c7a1d"
